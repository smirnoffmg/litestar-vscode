default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(bundled/tool/|src/test/python_tests/)|^noxfile\.py$
        exclude: ^src/test/python_tests/test_data/
      - id: ruff-format
        files: ^(bundled/tool/|src/test/python_tests/)|^noxfile\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        pass_filenames: false
        args: [noxfile.py]
        additional_dependencies: [nox]

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --max-warnings 0
        language: system
        types: [ts]

      - id: nox-tests
        name: nox -s tests (Python)
        entry: bash -c 'unset FORCE_COLOR NO_COLOR; nox -s tests --no-color'
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [ts, yaml]
        exclude: ^(out|dist|node_modules)/
