name: Release

on:
    push:
        tags:
            - 'v*'

jobs:
    release:
        name: Build and release VSIX
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            - name: Install dependencies
              run: npm ci

            - name: Install Python bundle (lsprotocol, pygls, etc.)
              run: |
                  pip install -t ./bundled/libs --no-cache-dir --implementation py --no-deps --upgrade -r ./requirements.txt

            - name: Lint
              run: npm run lint

            - name: Build extension
              run: npm run package

            - name: Package VSIX
              run: |
                  BASE_URL="${{ github.server_url }}/${{ github.repository }}"
                  BASE_IMAGES_URL="${BASE_URL}/raw/${{ github.ref_name }}"
                  npx @vscode/vsce package -o litestar.vsix --no-dependencies \
                      --baseContentUrl "${BASE_URL}" --baseImagesUrl "${BASE_IMAGES_URL}"

            - name: Rename VSIX with tag
              run: mv litestar.vsix "litestar-${{ github.ref_name }}.vsix"

            - name: Create Release and upload VSIX
              uses: softprops/action-gh-release@v2
              with:
                  files: 'litestar-${{ github.ref_name }}.vsix'
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
